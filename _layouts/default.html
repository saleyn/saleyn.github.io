<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #1b1f23;
      color: #e6e6e6;
      line-height: 1.6;
    }
    nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333;
    }
    nav a {
      color: #7a8aff;
      text-decoration: none;
      margin-right: 1.5rem;
    }
    nav a:hover { text-decoration: underline; }
    a { color: #7a8aff; }
    code {
      background: #2d333b;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #2d333b;
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    h1, h2, h3 { color: #fff; }

    /* Modern Responsive Image Rules */
    main img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 0 2rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
        font-size: 15px;
      }
    }

    /* Rouge Syntax Highlighting for Erlang / Slate */
    .highlight .k, .highlight .kd, .highlight .kr, .highlight .kn { color: #d73a49; font-weight: bold; } /* -module, -export */
    .highlight .nf, .highlight .fm { color: #6f42c1; font-weight: bold; } /* Functions */
    .highlight .s, .highlight .s2 { color: #032f62; }                    /* Strings */
    .highlight .ss { color: #22863a; font-weight: bold; }                 /* Atoms */
    .highlight .c, .highlight .c1 { color: #6a737d; font-style: italic; } /* Comments */
    .highlight .mi, .highlight .mf { color: #005cc5; }                    /* Numbers */
    .highlight .vc, .highlight .vg, .highlight .vi { color: #e36209; }    /* Variables */
    .highlight .o { color: #d73a49; }                                     /* Operators */
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="/about/">About</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
