<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #1b1f23;
      color: #e6e6e6;
      line-height: 1.6;
    }
    nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333;
    }
    nav a {
      color: #7a8aff;
      text-decoration: none;
      margin-right: 1.5rem;
    }
    nav a:hover { text-decoration: underline; }
    a { color: #7a8aff; }
    code {
      background: #2d333b;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #2d333b;
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    h1, h2, h3 { color: #fff; }

    /* Modern Responsive Image Rules */
    main img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 0 2rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
        font-size: 15px;
      }
    }

    /* Background & Line Numbers */
    .highlight { background: #1e1e1e !important; color: #d4d4d4 !important; border-radius: 6px; padding: 12px; }
    .highlight .lineno { color: #5a5a5a !important; padding-right: 12px; user-select: none; }

    /* Attributes */
    .highlight .ni { color: gray; }
    /* Modules */
    .highlight .nn { color: #c19536; }

    /* Comments */
    .highlight .c, .highlight .c1, .highlight .cs { color: #6A9955 !important; font-style: italic; }

    /* Erlang Module Attributes & Directives (-module, -export, -define, -record) */
    .highlight .p-Indicator,
    .highlight .kn,
    .highlight .nd { color: #C586C0 !important; font-weight: bold; }

    /* Keywords (case, of, receive, end, fun) & Operators (->, ::, =:=) */
    .highlight .k, .highlight .kd, .highlight .kr, .highlight .o, .highlight .ow { color: #C586C0 !important; font-weight: bold; }

    /* Erlang Variables (Capitalized words: Port, ClientSockOpts) */
    .highlight .vc, .highlight .vg, .highlight .vi, .highlight .nv { color: #9CDCFE !important; }

    /* Macros (?MODULE, ?DEFAULT_PORT) */
    .highlight .p, .highlight .bp { color: #4FC1FF !important; }

    /* Atoms ('ok', 'error', 'gen_server', 'async_tcp_server') */
    .highlight .ss, .highlight .s2 { color: #CE9178 !important; }

    /* Functions & Function Definitions (start_link, init, handle_call) */
    .highlight .nf, .highlight .fm, .highlight .na { color: #DCDCAA !important; }

    /* Numbers & Arity Slash (8080, /1, /2) */
    .highlight .m, .highlight .mi, .highlight .mf { color: #B5CEA8 !important; }

    /* Types (socket(), list(), reference()) */
    .highlight .kt, .highlight .nc { color: #4EC9B0 !important; }

    /* Strings */
    .highlight .s, .highlight .sb, .highlight .sc { color: #CE9178 !important; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="/software/">Software</a>
    <a href="/about/">About</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
