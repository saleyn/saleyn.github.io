<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #1b1f23;
      color: #e6e6e6;
      line-height: 1.6;
    }
    nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333;
    }
    nav a {
      color: #7a8aff;
      text-decoration: none;
      margin-right: 1.5rem;
    }
    nav a:hover { text-decoration: underline; }
    a { color: #7a8aff; }
    code {
      background: #2d333b;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    pre {
      background: #2d333b;
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    h1, h2, h3 { color: #fff; }
    main > img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 0 2rem;
    }
    @media (max-width: 480px) {
      main > img {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="/about/">About</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
